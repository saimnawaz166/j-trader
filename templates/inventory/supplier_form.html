{% extends "base.html" %}

{% block title %}Add Supplier{% endblock %}

{% block page_title %}Add Supplier{% endblock %}

{% block content %}

<div class="page-header">

    <h1>Add Supplier</h1>

    <a
        href="{% url 'supplier_list' %}"
        class="btn btn-secondary">
        Back
    </a>

</div>


<div class="form-card">

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <label>Supplier Name *</label>

            <input
                type="text"
                name="name"
                required
                placeholder="Supplier name"
            >

        </div>


        <div class="form-group">

            <label>Phone</label>

            <input
                type="text"
                name="phone"
                placeholder="Phone number"
            >

        </div>


        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                name="email"
                placeholder="Email address"
            >

        </div>


        <div class="form-group">

            <label>Address</label>

            <textarea
                name="address"
                placeholder="Supplier address..."
            ></textarea>

        </div>


        <button
            type="submit"
            class="btn btn-primary">
            Save Supplier
        </button>

    </form>

</div>

{% endblock %}
