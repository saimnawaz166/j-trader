{% extends "base.html" %}

{% block title %}Products{% endblock %}

{% block page_title %}Products{% endblock %}

{% block extra_head %}
<style>

.stock-badge {
    display: inline-block;
    padding: 4px 10px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
}

.stock-badge.stock-low {
    background: #fef3c7;
    color: #92400e;
}

.stock-badge.stock-out {
    background: #fee2e2;
    color: #991b1b;
}

</style>
{% endblock %}

{% block content %}

<div class="page-header">

    <div>
        <h1>Products</h1>
        <p>Product catalog - name, price and stock</p>
    </div>

    <a
        href="{% url 'product_create' %}"
        class="btn btn-primary">
        + Add Product
    </a>

</div>


<div class="table-container">

    <table class="datatable" data-ajax="{% url 'product_data' %}">

        <thead>

            <tr>
                <th data-field="name">Name</th>
                <th data-field="price">Price</th>
                <th data-field="quantity">Stock</th>
                <th data-field="actions" data-orderable="false" data-searchable="false">Actions</th>
            </tr>

        </thead>

        <tbody></tbody>

    </table>

</div>

{% endblock %}
